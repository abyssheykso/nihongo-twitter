<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日推练习场 · にちぷれ</title>
<style>
:root{
  --blue:#1d9bf0; --blue-dark:#1a8cd8; --bg:#ffffff; --border:#e6e9ec;
  --text:#0f1419; --sub:#536471; --like:#f91880; --rt:#00ba7c; --gold:#ff9500;
  --card:#f7f9f9;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans","Noto Sans JP","Microsoft YaHei",sans-serif;
  background:#fff;color:var(--text);display:flex;justify-content:center}
.app{display:grid;grid-template-columns:260px 600px 320px;gap:0;min-height:100vh;width:100%;max-width:1240px}
/* 左栏 */
.left{border-right:1px solid var(--border);padding:16px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.logo{font-size:22px;font-weight:800;padding:8px 12px 20px;cursor:pointer}
.logo span{color:var(--blue)}
.nav-item{display:flex;align-items:center;gap:14px;padding:12px;border-radius:999px;font-size:18px;
  cursor:pointer;color:var(--text);margin-bottom:4px}
.nav-item:hover{background:var(--card)}
.nav-item.active{font-weight:700;color:var(--blue)}
.nav-item .ico{font-size:20px;width:26px;text-align:center}
.profile-card{margin-top:20px;padding:14px;border:1px solid var(--border);border-radius:16px;background:var(--card)}
.profile-card .nick{font-weight:700;font-size:16px}
.profile-card .handle{color:var(--sub);font-size:13px}
.profile-card .bio{font-size:13px;color:var(--sub);margin-top:6px}
.stat-row{display:flex;gap:16px;margin-top:10px;font-size:13px;color:var(--sub)}
.stat-row b{color:var(--text);font-size:15px;display:block}
/* 中栏 */
.main{border-right:1px solid var(--border);min-height:100vh}
.main-head{position:sticky;top:0;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border);padding:14px 16px;font-size:18px;font-weight:800;z-index:5}
.composer{border-bottom:1px solid var(--border);padding:14px 16px;display:flex;gap:10px}
.avatar{width:44px;height:44px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;
  justify-content:center;font-size:24px;color:#fff}
.composer-body{flex:1}
.composer textarea{width:100%;border:none;outline:none;resize:none;font-size:17px;font-family:inherit;
  min-height:70px;padding-top:6px}
.composer-toolbar{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--border);padding-top:8px}
.char-count{font-size:13px;color:var(--sub)}
.char-count.over{color:var(--like);font-weight:700}
.tweet-btn{background:var(--blue);color:#fff;border:none;border-radius:999px;padding:8px 22px;
  font-size:15px;font-weight:700;cursor:pointer}
.tweet-btn:hover{background:var(--blue-dark)}
.tweet-btn:disabled{opacity:.5;cursor:not-allowed}
.tweet{border-bottom:1px solid var(--border);padding:14px 16px;display:flex;gap:10px;animation:fadein .3s}
@keyframes fadein{from{opacity:0;transform:translateY(-6px)}to{opacity:1}}
.tweet .body{flex:1;min-width:0}
.t-head{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.t-head .name{font-weight:700;font-size:15px}
.t-head .handle,.t-head .time{color:var(--sub);font-size:13px}
.t-text{font-size:16px;line-height:1.6;margin-top:4px;white-space:pre-wrap;word-break:break-word}
.t-actions{display:flex;gap:32px;margin-top:10px;color:var(--sub);font-size:13px}
.t-actions span{cursor:pointer}
.t-actions span:hover{color:var(--blue)}
.level-badge{display:inline-block;font-size:12px;padding:2px 10px;border-radius:999px;margin-top:8px;font-weight:700}
.lv-ok{background:#e8f5e9;color:#2e7d32}.lv-mid{background:#fff8e1;color:#f57f17}
.lv-bad{background:#fff3e0;color:#e65100}.lv-wtf{background:#fce4ec;color:#c62828}
.loading{color:var(--sub);font-size:14px;padding:8px 0}
.replies{margin-top:12px;border-left:3px solid var(--border);padding-left:14px;display:flex;flex-direction:column;gap:12px}
.reply{background:var(--card);border-radius:12px;padding:10px 12px;font-size:14px;display:flex;gap:10px}
.reply .r-head{font-size:13px;margin-bottom:4px;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.reply .r-name{font-weight:700}
.reply .r-handle,.reply .r-time{color:var(--sub)}
.reply .r-text{line-height:1.6;white-space:pre-wrap}
.reply .r-exp{background:#fff;border-left:3px solid var(--gold);padding:6px 10px;margin-top:6px;
  border-radius:0 8px 8px 0;color:#6d4c00;font-size:13px;line-height:1.6}
.r-qt{border:1px dashed var(--rt);background:#f0faf5}
.like-row{margin-top:8px;font-size:14px;color:var(--like);font-weight:700}
.del-btn{margin-left:auto;color:var(--sub);font-size:12px;cursor:pointer;background:none;border:none}
.del-btn:hover{color:var(--like)}
.empty{padding:60px 20px;text-align:center;color:var(--sub)}
.empty .big{font-size:46px;margin-bottom:12px}
/* 右栏 */
.right{padding:16px;position:sticky;top:0;height:100vh;overflow-y:auto}
.panel{border:1px solid var(--border);border-radius:16px;margin-bottom:16px;overflow:hidden}
.panel h3{padding:12px 16px;font-size:16px;border-bottom:1px solid var(--border)}
.panel .row{padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;font-size:14px}
.panel .row:hover{background:var(--card)}
.panel .row:last-child{border-bottom:none}
.panel .row .t-jp{font-weight:700}
.panel .row .t-zh{color:var(--sub);font-size:12px;margin-top:2px}
.panel .row .t-tpl{color:var(--blue);font-size:12px;margin-top:4px}
.f-row{display:flex;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--border)}
.f-row:last-child{border-bottom:none}
.f-row .f-info{flex:1;min-width:0}
.f-row .f-name{font-size:14px;font-weight:700}
.f-row .f-bio{font-size:12px;color:var(--sub)}
.gear-btn{position:fixed;bottom:24px;right:24px;width:52px;height:52px;border-radius:50%;background:var(--text);
  color:#fff;border:none;font-size:22px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:50}
.gear-btn:hover{transform:rotate(30deg);transition:.3s}
/* 弹窗 */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:100}
.modal-mask.show{display:flex}
.modal{background:#fff;border-radius:16px;width:480px;max-width:92vw;max-height:88vh;overflow-y:auto;padding:24px}
.modal h2{font-size:19px;margin-bottom:16px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:var(--sub)}
.field input,.field select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;font-size:14px;outline:none}
.field input:focus{border-color:var(--blue)}
.modal .btns{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
.btn{padding:9px 18px;border-radius:999px;border:none;font-size:14px;font-weight:700;cursor:pointer}
.btn-primary{background:var(--blue);color:#fff}
.btn-ghost{background:var(--card);color:var(--text)}
.btn-danger{background:#fee;color:#c00}
.modal .hint{font-size:12px;color:var(--sub);margin-top:10px;line-height:1.7}
.test-result{font-size:13px;margin-top:8px;padding:8px 12px;border-radius:8px;display:none}
.test-ok{display:block;background:#e8f5e9;color:#2e7d32}
.test-err{display:block;background:#fee;color:#c00}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;
  padding:10px 22px;border-radius:999px;font-size:14px;z-index:200;display:none}
.report{padding:20px}
.report h4{margin:14px 0 8px;font-size:15px}
.report .big-stats{display:flex;gap:20px;flex-wrap:wrap}
.report .bs{background:var(--card);border-radius:12px;padding:12px 18px;text-align:center;flex:1;min-width:90px}
.report .bs b{font-size:24px;display:block;color:var(--blue)}
.bar-row{display:flex;align-items:center;gap:8px;font-size:13px;margin:4px 0}
.bar-row .bar{height:10px;background:var(--blue);border-radius:5px;min-width:4px}
.chat-input{padding:8px 14px;border:1px solid var(--border);border-radius:999px;font-size:14px;outline:none;width:calc(100% - 86px)}
.api-badge{font-size:11px;padding:2px 8px;border-radius:999px;margin-left:8px}
.api-on{background:#e8f5e9;color:#2e7d32}.api-off{background:#fee;color:#c00}
@media(max-width:1000px){.app{grid-template-columns:70px 1fr}.left .nav-item span.txt,.profile-card{display:none}.right{display:none}}
</style>
</head>
<body>
<div class="app">
  <div class="left">
    <div class="logo" onclick="switchTab('home')">🐦 にちぷ<span>れ</span></div>
    <div class="nav-item active" data-tab="home" onclick="switchTab('home')"><span class="ico">🏠</span><span class="txt">ホーム</span></div>
    <div class="nav-item" data-tab="notice" onclick="switchTab('notice')"><span class="ico">🔔</span><span class="txt">通知</span></div>
    <div class="nav-item" data-tab="report" onclick="switchTab('report')"><span class="ico">📊</span><span class="txt">练习报告</span></div>
    <div class="nav-item" onclick="openSettings()"><span class="ico">⚙️</span><span class="txt">設定</span></div>
    <div class="profile-card">
      <div class="nick" id="pf-nick">あなた</div>
      <div class="handle" id="pf-handle">@you</div>
      <div class="bio" id="pf-bio">日本語練習中 📝</div>
      <div class="stat-row">
        <div><b id="st-followers">100</b>粉丝</div>
        <div><b id="st-likes">0</b>🍙</div>
        <div><b id="st-posts">0</b>推文</div>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="main-head" id="main-head">ホーム</div>
    <div id="home-view">
      <div class="composer">
        <div class="avatar" style="background:#7856ff">🙂</div>
        <div class="composer-body">
          <textarea id="tweet-input" placeholder="日本語でツイートしてみよう…（用日语发推，错了粉丝会温柔教你）" maxlength="280"></textarea>
          <div class="composer-toolbar">
            <span class="char-count" id="char-count">0 / 280</span>
            <button class="tweet-btn" id="tweet-btn" onclick="postTweet()">ツイート</button>
          </div>
        </div>
      </div>
      <div id="feed"></div>
    </div>
    <div id="notice-view" style="display:none"></div>
    <div id="report-view" style="display:none"></div>
  </div>

  <div class="right">
    <div class="panel">
      <h3>🔥 趋势话题（点击填入草稿）</h3>
      <div id="trends"></div>
    </div>
    <div class="panel">
      <h3>👥 关注者 <span class="api-badge api-off" id="api-badge">未配置 API</span></h3>
      <div id="followers"></div>
    </div>
  </div>
</div>

<button class="gear-btn" onclick="openSettings()" title="設定">⚙️</button>

<div class="modal-mask" id="settings-mask">
  <div class="modal">
    <h2>⚙️ 設定</h2>
    <div class="field"><label>你的日语昵称（ツイプロ名）</label><input id="set-nick" placeholder="例如：たろう"></div>
    <div class="field"><label>一句话简介</label><input id="set-bio" placeholder="日本語練習中 📝"></div>
    <hr style="border:none;border-top:1px solid var(--border);margin:16px 0">
    <div class="field"><label>API Base URL（OpenAI 兼容，留空则用离线演示模式）</label>
      <input id="set-base" placeholder="https://api.example.com/v1"></div>
    <div class="field"><label>API Key</label><input id="set-key" type="password" placeholder="sk-..."></div>
    <div class="field"><label>模型名</label><input id="set-model" placeholder="例如：gpt-4o-mini / kimi-k2"></div>
    <div class="btns">
      <button class="btn btn-primary" onclick="saveSettings()">保存</button>
      <button class="btn btn-ghost" onclick="testAPI()">测试连接</button>
      <button class="btn btn-danger" onclick="clearData()">清空数据</button>
      <button class="btn btn-ghost" onclick="closeSettings()">关闭</button>
    </div>
    <div class="test-result" id="test-result"></div>
    <div class="hint">
      · 数据只存在你自己的浏览器 localStorage 里，Key 不会上传到任何第三方（除了你填的 API 服务本身）。<br>
      · 浏览器直连需要 API 服务允许跨域（CORS）；如果测试连接报跨域错误，请换支持 CORS 的接口或用代理。<br>
      · 留空 API 时使用内置离线演示模式（反馈较简单，仅供体验玩法）。
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ========== 粉丝人设 ========== */
const PERSONAS=[
 {handle:"@yukari_tanaka",name:"田中ゆかり",emoji:"🌸",color:"#f4a7b9",bio:"28岁·东京OL·温柔点赞狂魔"},
 {handle:"@kenta_saito",name:"佐藤ケンタ",emoji:"🔥",color:"#ff8c42",bio:"22岁·大阪·関西弁话痨大学生"},
 {handle:"@misaki_yamada",name:"山田ミサキ",emoji:"🔍",color:"#7ec8e3",bio:"35岁·京都·敬语与语感警察"},
 {handle:"@ichiro_suzuki",name:"鈴木一郎",emoji:"🤓",color:"#9b8aa6",bio:"31岁·程序员·结构化语法控"},
 {handle:"@ai_takahashi",name:"高橋あい",emoji:"🎮",color:"#c084fc",bio:"19岁·动漫宅·甩台词陪练"}
];
const TRENDS=[
 {jp:"#今日のごはん",zh:"今天吃了什么？",tpl:"今日のごはんは___です！"},
 {jp:"#週末の予定",zh:"周末打算干嘛？",tpl:"週末は___する予定です"},
 {jp:"#最近ハマってるもの",zh:"最近沉迷什么？",tpl:"最近___にハマってます"},
 {jp:"#天気について",zh:"聊聊天气",tpl:"今日の天気は___ですね"},
 {jp:"#日本語の質問",zh:"日语疑问求助",tpl:"___の使い方がよく分かりません…誰か教えて！"}
];

/* ========== 状态 ========== */
let S=load();
function load(){
 try{const s=JSON.parse(localStorage.getItem("nichipure"));if(s&&s.tweets)return s;}catch(e){}
 return {tweets:[],stats:{followers:100,likes:0,posts:0,correct:0},tally:{},settings:{nick:"",bio:"日本語練習中 📝",base:"",key:"",model:""},welcome:false};
}
function save(){localStorage.setItem("nichipure",JSON.stringify(S));}

/* ========== 界面渲染 ========== */
function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML;}
function pOf(handle){return PERSONAS.find(p=>p.handle===handle)||PERSONAS[0];}
function avatarHTML(p,cls){return `<div class="avatar ${cls||""}" style="background:${p.color}">${p.emoji}</div>`;}

function renderFollowers(){
 document.getElementById("followers").innerHTML=PERSONAS.map(p=>
  `<div class="f-row">${avatarHTML(p)}<div class="f-info"><div class="f-name">${p.name} <span style="color:var(--sub);font-weight:400;font-size:12px">${p.handle}</span></div><div class="f-bio">${p.bio}</div></div></div>`).join("");
}
function renderTrends(){
 document.getElementById("trends").innerHTML=TRENDS.map((t,i)=>
  `<div class="row" onclick="useTrend(${i})"><div class="t-jp">${t.jp}</div><div class="t-zh">${t.zh}</div><div class="t-tpl">💬 ${esc(t.tpl)}</div></div>`).join("");
}
function useTrend(i){
 const ta=document.getElementById("tweet-input");ta.value=TRENDS[i].tpl;ta.focus();updateCount();
 switchTab("home");toast("已填入草稿，把 ___ 换成你自己的内容吧");
}
function updateStats(){
 document.getElementById("st-followers").textContent=S.stats.followers;
 document.getElementById("st-likes").textContent=S.stats.likes;
 document.getElementById("st-posts").textContent=S.stats.posts;
 const badge=document.getElementById("api-badge");
 if(S.settings.key){badge.textContent="API 已连接";badge.className="api-badge api-on";}
 else{badge.textContent="离线演示模式";badge.className="api-badge api-off";}
 const nick=S.settings.nick||"あなた";
 document.getElementById("pf-nick").textContent=nick;
 document.getElementById("pf-handle").textContent="@"+(nick.replace(/\s+/g,"_")||"you");
 document.getElementById("pf-bio").textContent=S.settings.bio||"日本語練習中 📝";
}
const LV={ "✅":["lv-ok","完全正确！"], "🟡":["lv-mid","小错误，已经很接近啦"], "🟠":["lv-bad","有几处要修，粉丝来讲解"], "🔴":["lv-wtf","粉丝们没看懂，温柔确认中"] };
function renderFeed(){
 const feed=document.getElementById("feed");
 if(!S.tweets.length){feed.innerHTML=`<div class="empty"><div class="big">🐤</div>还没有推文。<br>用上面的输入框发一条日语推文，粉丝们在等你哦！</div>`;return;}
 feed.innerHTML=S.tweets.map(t=>{
  let h=`<div class="tweet"><div class="avatar" style="background:#7856ff">🙂</div><div class="body">
   <div class="t-head"><span class="name">${esc(S.settings.nick||"あなた")}</span>
   <span class="handle">@${(S.settings.nick||"you").replace(/\s+/g,"_")}</span>
   <span class="time">· ${t.time}</span>
   <button class="del-btn" onclick="delTweet('${t.id}')">删除</button></div>
   <div class="t-text">${esc(t.text)}</div>`;
  if(t.loading){h+=`<div class="loading">🍙 粉丝们正在回复…</div>`;}
  else if(t.res){
   const lv=LV[t.res.level]||LV["🟡"];
   h+=`<span class="level-badge ${lv[0]}">${t.res.level} ${lv[1]}</span>`;
   if(t.res.likes>0)h+=`<div class="like-row">🍙 × ${t.res.likes}　田中ゆかり 等人</div>`;
   const all=[...(t.res.replies||[]).map(r=>({...r,qt:false})),...(t.res.quote_rts||[]).map(r=>({...r,qt:true}))];
   if(all.length){
    h+=`<div class="replies">`+all.map(r=>{
     const p=pOf(r.handle);
     return `<div class="reply ${r.qt?"r-qt":""}">${avatarHTML(p)}
      <div style="flex:1;min-width:0">
      <div class="r-head"><span class="r-name">${p.name}</span><span class="r-handle">${p.handle}</span><span class="r-time">· たった今</span>${r.qt?'<span style="color:var(--rt);font-size:12px">🔁 引用转推</span>':""}</div>
      <div class="r-text">${esc(r.text)}</div>
      ${r.explanation?`<div class="r-exp">💡 ${esc(r.explanation)}</div>`:""}
      </div></div>`;
    }).join("")+`</div>`;
   }
  }
  if(t.convo&&t.convo.length){
   h+=`<div class="replies" style="border-left-color:var(--blue)">`+t.convo.map(c=>{
    if(c.who==="user")return `<div class="reply" style="background:#eef7ff"><div class="avatar" style="background:#7856ff;width:32px;height:32px;font-size:16px;flex-shrink:0">🙂</div>
      <div style="flex:1;min-width:0"><div class="r-head"><span class="r-name">${esc(S.settings.nick||"あなた")}</span><span class="r-time">· あなた</span></div><div class="r-text">${esc(c.text)}</div></div></div>`;
    const p=pOf(c.handle);
    return `<div class="reply">${avatarHTML(p)}<div style="flex:1;min-width:0"><div class="r-head"><span class="r-name">${p.name}</span><span class="r-handle">${p.handle}</span></div><div class="r-text">${esc(c.text)}</div>${c.explanation?`<div class="r-exp">💡 ${esc(c.explanation)}</div>`:""}</div></div>`;
   }).join("")+`</div>`;
  }
  if(!t.loading)h+=`<div style="margin-top:10px"><button class="btn btn-ghost" style="font-size:12px;padding:5px 14px" onclick="toggleChat('${t.id}')">💬 和粉丝继续聊</button></div>
  <div id="chat-${t.id}" style="display:none;margin-top:8px"><input class="chat-input" id="ci-${t.id}" placeholder="用日语或中文回复粉丝…" onkeydown="if(event.key==='Enter')chatReply('${t.id}')"><button class="btn btn-primary" style="font-size:12px;padding:6px 14px;margin-left:6px" onclick="chatReply('${t.id}')">发送</button></div>`;
  h+=`</div></div>`;return h;
 }).join("");
}
function renderNotice(){
 const box=document.getElementById("notice-view");
 let items=[];
 S.tweets.forEach(t=>{ if(!t.res)return;
  if(t.res.likes>0)items.push(`<div class="tweet"><div class="avatar" style="background:var(--like)">🍙</div><div class="body"><b>田中ゆかり</b> 和其他人给你的推文「${esc(t.text.slice(0,24))}…」点了 ${t.res.likes} 个心心</div></div>`);
  (t.res.replies||[]).forEach(r=>{const p=pOf(r.handle);items.push(`<div class="tweet">${avatarHTML(p)}<div class="body"><b>${p.name}</b> <span style="color:var(--sub)">${p.handle}</span> 回复了你：${esc(r.text.slice(0,60))}${r.text.length>60?"…":""}</div></div>`);});
  (t.res.quote_rts||[]).forEach(r=>{const p=pOf(r.handle);items.push(`<div class="tweet">${avatarHTML(p)}<div class="body"><b>${p.name}</b> <span style="color:var(--sub)">${p.handle}</span> <span style="color:var(--rt)">🔁 引用转推</span> 了你的推文并讲解了语法</div></div>`);});

 v.innerHTML=`<div class="report">

  <h4>💡 学习建议</h4>

 </div>`;

function switchTab(tab){

/* ========== 发推流程 ========== */
function nowStr(){const d=new Date();return `${d.getMonth()+1}月${d.getDate()}日`;}
async function postTweet(){
 const ta=document.getElementById("tweet-input"),text=ta.value.trim();
 if(!text){toast("先写点什么吧");return;}
 if(text.length>280){toast("超过 280 字啦");return;}
 const id="t"+Date.now();
 S.tweets.unshift({id,text,time:nowStr(),loading:true,res:null,convo:[]});
 S.stats.posts++;save();ta.value="";updateCount();renderFeed();updateStats();
 let res;
 if(S.settings.key){ try{res=await callLLM(text);}catch(e){
   S.tweets.find(t=>t.id===id).loading=false;save();renderFeed();
   toast("API 调用失败："+(e.message||e)+"（可到设置里检查，或先切离线演示）");return; } }
 else res=offlineDemo(text);
 const tw=S.tweets.find(t=>t.id===id);
 tw.loading=false;tw.res=res;
 S.stats.likes+=res.likes||0;
 if(res.level==="✅"){S.stats.correct++;if(S.stats.posts%3===0)S.stats.followers++;}
 (res.error_types||[]).forEach(k=>{S.tally[k]=(S.tally[k]||0)+1;});
 save();renderFeed();updateStats();
 toast(res.level==="✅"?"🍙 完全正确！粉丝狂点心中":"💬 粉丝回复了你，看看纠正吧");
}
function delTweet(id){S.tweets=S.tweets.filter(t=>t.id!==id);save();renderFeed();toast("已删除");}
function updateCount(){const n=document.getElementById("tweet-input").value.length;const c=document.getElementById("char-count");c.textContent=n+" / 280";c.classList.toggle("over",n>280);}

/* ========== LLM 调用 ========== */
function systemPrompt(){
 return `你是「日推练习场」应用里所有日本粉丝的人格集合。用户是中文母语的日语学习者，在模拟推特上发日语推文练习。粉丝要像真实推特上的活人朋友一样和用户互动，而不是批改作业的老师。

【粉丝人设（严格遵守，性格差异要明显）】
🌸田中ゆかり@yukari_tanaka：28岁东京OL，温柔包容，像大姐姐，爱夸人爱点赞，常分享自己的生活小事。
🔥佐藤ケンタ@kenta_saito：22岁大阪大学生，関西弁口癖（やで／ほんま／ちゃう？），活泼话痨，爱开玩笑接梗，爱聊吃喝和大学生活。
🔍山田ミサキ@misaki_yamada：35岁京都主妇，心细周到，会认真回答别人问的问题，纠正错误时温柔具体。
🤓鈴木一郎@ichiro_suzuki：31岁程序员，说话直接但热心，喜欢把事情讲清楚，偶尔吐槽自己加班。
🎮高橋あい@ai_takahashi：19岁动漫宅，元气满满，动不动就联想到动漫，爱用颜文字，爱反问别人。

【互动规则（最重要）】
1. 内容优先：每条推文必须引发粉丝对「内容本身」的真实反应——如果用户提了问题，要有人认真回答；如果是分享日常，要有人共鸣、分享自己类似的经历、发表看法、开玩笑。纠错只是互动的一部分，绝不是全部。
2. 有来有回：粉丝要经常反问用户（「〜なんですか？」「どこで〜たんですか？」），推动对话继续。说对了也要积极互动，而不只是干巴巴地夸。
3. 有记忆：给定【用户最近的推文与互动】时，粉丝要自然地提起之前的事、追问后续（比如之前说要去取快递，就问他拿到了没）。
4. 纠错方式：小错口头带过、自然融入对话（如「『に』のほうが自然かも！」）；只有影响理解的错误才用 ❌/✅ 对照，且先扬后抑，绝不打击人。
5. 语言：粉丝正文只说日语，要像真实网友：短句、口语、emoji、颜文字。中文讲解只在确实纠正语法时放在 explanation 字段，闲聊回复 explanation 留空。
6. 🔴（基本看不懂）时：不逐条纠正，粉丝用简单日语温柔确认意思，并给正确示范。

【输出格式】只输出一个 JSON 对象（不要markdown代码块），格式：
{"level":"✅|🟡|🟠|🔴","likes":数字,"replies":[{"handle":"@kenta_saito","text":"日语正文","explanation":"中文讲解（仅纠错时填）"}],"quote_rts":[{"handle":"@ichiro_suzuki","text":"引用转推正文，可以是深入讲解，也可以是激动共鸣/分享"}],"error_types":["助詞"]}
- 等级：✅完全正确 / 🟡仅1处小错 / 🟠2处以上错误或不自然 / 🔴基本看不懂。
- likes：✅→15~40；🟡→3~8；🟠→0~3；🔴→2~5。
- replies 数量：✅→2~3条（以互动为主）；🟡→2条（1条纠错+1条内容互动）；🟠→2~3条；🔴→2条。
- quote_rts 可不出现；出现时多为鈴木或ケンタ，内容可以是讲解也可以是「わかるわ〜」式的共鸣转发。
- error_types 从：助詞/動詞変形/時制/敬語/語彙/語順/その他 中选，没错就留空数组。`;
}
function chatSystemPrompt(){
 return `你是「日推练习场」里所有日本粉丝的人格集合，正在和用户进行推特式对话。用户可能用日语或中文发言。

【人设】🌸田中ゆかり@yukari_tanaka（温柔OL姐姐）；🔥佐藤ケンタ@kenta_saito（関西弁话痨大学生）；🔍山田ミサキ@misaki_yamada（细心主妇）；🤓鈴木一郎@ichiro_suzuki（直接热心的程序员）；🎮高橋あい@ai_takahashi（元气动漫宅）。

【规则】
1. 像真正的朋友聊天：回答用户的问题、回应他的观点、分享自己相关的事、开开玩笑、反问用户，有来有回。
2. 用户说日语时若有小错，顺手自然纠正（口头带过即可，别批改腔）；用户用中文说话就正常用日语聊（可适当放慢、用简单日语）。
3. 保持各自人设的口癖和性格差异，回复短句口语化，像真实推特回复。
4. 只输出 JSON：{"replies":[{"handle":"@...","text":"日语正文","explanation":"中文讲解（仅纠错时）"}]}，输出2~3条不同的粉丝回复。`;
}
function recentContext(){
 const ts=S.tweets.slice(0,4).map(t=>{
  let s="用户推文：「"+t.text+"」";
  if(t.res&&t.res.replies)(t.res.replies||[]).slice(0,3).forEach(r=>{s+="\n  "+pOf(r.handle).name+"曾回复："+String(r.text).slice(0,80);});
  (t.convo||[]).slice(-4).forEach(c=>{s+="\n  "+(c.who==="user"?"用户":pOf(c.handle).name)+":"+String(c.text).slice(0,80);});
  return s;
 }).join("\n---\n");
 return ts?"\n\n【用户最近的推文与互动（粉丝记得这些事，要在回复中自然提起、追问、接梗）】\n"+ts:"";
}
async function callLLM(text){
 const base=S.settings.base.replace(/\/+$/,"")||"https://api.openai.com/v1";
 const r=await fetch(base+"/chat/completions",{method:"POST",
  headers:{"Content-Type":"application/json","Authorization":"Bearer "+S.settings.key},
  body:JSON.stringify({model:S.settings.model||"gpt-4o-mini",
   messages:[{role:"system",content:systemPrompt()+recentContext()+"\n\n现在用户的新推文："+text}],
   temperature:0.8,max_tokens:1200})});
 if(!r.ok){const e=await r.text().catch(()=> "");throw new Error("HTTP "+r.status+(e?"："+e.slice(0,120):""));}
 const j=await r.json();
 let content=j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content||"";
 content=content.replace(/```json|```/g,"").trim();
 const m=content.match(/\{[\s\S]*\}/);
 if(!m)throw new Error("模型没有返回有效 JSON");
 const res=JSON.parse(m[0]);
 return normalizeRes(res);
}
function normalizeRes(res){
 const okH=PERSONAS.map(p=>p.handle);
 (res.replies||[]).forEach(r=>{if(!okH.includes(r.handle))r.handle=okH[2];});
 (res.quote_rts||[]).forEach(r=>{if(!okH.includes(r.handle))r.handle=okH[3];});
 if(!res.level||!LV[res.level])res.level="🟡";
 res.likes=Math.max(0,Math.min(99,parseInt(res.likes)||0));
 return res;
}

 const inp=document.getElementById("ci-"+id),text=inp.value.trim();if(!text)return;
 const t=S.tweets.find(x=>x.id===id);
 t.convo=t.convo||[];t.convo.push({who:"user",text});

 toast("🍙 粉丝正在回复…");

async function chatLLM(t){
 const base=S.settings.base.replace(/\/+$/,"")||"https://api.openai.com/v1";
 const history=t.convo.map(c=>c.who==="user"?"用户："+c.text:pOf(c.handle).name+"："+c.text).join("\n");
 const r=await fetch(base+"/chat/completions",{method:"POST",
  headers:{"Content-Type":"application/json","Authorization":"Bearer "+S.settings.key},
  body:JSON.stringify({model:S.settings.model||"gpt-4o-mini",
   messages:[{role:"system",content:chatSystemPrompt()},{role:"user",content:"用户最初的推文：「"+t.text+"」\n之后的对话：\n"+history}],
   temperature:0.85,max_tokens:900})});
 if(!r.ok)throw new Error("HTTP "+r.status);
 const j=await r.json();
 let content=(j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||"";
 content=content.replace(/```json|```/g,"").trim();
 const m=content.match(/\{[\s\S]*\}/);if(!m)throw new Error("模型没有返回有效 JSON");
 const res=JSON.parse(m[0]);
 const okH=PERSONAS.map(pp=>pp.handle);
 [...(res.replies||[]),...(res.quote_rts||[])].forEach(rr=>{if(!okH.includes(rr.handle))rr.handle="@ai_takahashi";});
 return res;
}

/* ========== 离线演示模式 ========== */
function offlineDemo(text){
 const issues=[];
 if(/で[^、。]*で/.test(text))issues.push({type:"助詞",tip:"一句话里两个「で」连用会显得头重脚轻，可以把长定语先说、地点状语后移。"});
 if(!/(です|ます|だ|ですね|ました|ません)/.test(text))issues.push({type:"時制",tip:"句尾加「です／ます」会让整句更礼貌自然（だ体适合熟人）。"});
 if(/受け取ります/.test(text)&&!/に行き/.test(text))issues.push({type:"語彙",tip:"去某地自取要说「受け取りに行きます」，单说「受け取ります」像「它自己会寄到」。"});
 const praise="いいですね！よく書けてます";
 const isQ=/[？?か][。！!]?$/.test(text)||/ですか|ますか|の？|かな/.test(text);
 const contentReact=isQ
  ?[{handle:"@ai_takahashi",text:"いい質問！（离线演示：配置API后粉丝会认真回答你的问题并反问你哦）",explanation:""},
    {handle:"@kenta_saito",text:"おれも気になる！どう思うん？",explanation:""}]
  :[{handle:"@kenta_saito",text:"おお！わかるわかる！（离线演示：配置API后粉丝会对内容分享看法、聊自己的事）",explanation:""}];
 if(!issues.length)return {level:"✅",likes:18+Math.floor(Math.random()*15),
  replies:[{handle:"@yukari_tanaka",text:praise+"🌸",explanation:""},...contentReact],
  quote_rts:[],error_types:[]};
 if(issues.length===1)return {level:"🟡",likes:3+Math.floor(Math.random()*5),
  replies:[{handle:"@misaki_yamada",text:"よく書けてますよ〜！ひとつだけ："+text+"\n💡【离线演示】"+issues[0].tip,explanation:issues[0].tip},
   {handle:"@yukari_tanaka",text:"それ以外はバッチリです！",explanation:""}],
  quote_rts:[],error_types:[issues[0].type]};
 return {level:"🟠",likes:1,
  replies:[{handle:"@yukari_tanaka",text:"だいじょうぶ！ひとつずつ直していこう🌸",explanation:""},
   {handle:"@misaki_yamada",text:"💡【离线演示】\n"+issues.map(i=>"・"+i.tip).join("\n"),explanation:issues.map(i=>i.tip).join("；")}],
  quote_rts:[{handle:"@ichiro_suzuki",text:"【离线演示】配置 API 后这里会给出完整的结构化语法讲解。"}],
  error_types:issues.map(i=>i.type)};
}

async function testAPI(){
